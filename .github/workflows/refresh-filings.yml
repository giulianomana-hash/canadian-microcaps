name: Scrape filings (TMX + SEDAR+)

# 9 AM and 4 PM in São Paulo / Buenos Aires (GMT-3) = 12:00 and 19:00 UTC.
on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BACKEND_URL: ${{ secrets.REFRESH_API_URL }}
      REFRESH_SECRET: ${{ secrets.REFRESH_SECRET }}
      SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Sanity check secrets
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$REFRESH_SECRET" ]; then
            echo "Missing REFRESH_API_URL or REFRESH_SECRET secret." >&2
            exit 1
          fi
          if [ -z "$SCRAPERAPI_KEY" ]; then
            echo "::warning::SCRAPERAPI_KEY not set — SEDAR+ layer disabled, TMX only."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python deps
        run: pip install -r scripts/requirements.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        working-directory: scripts
        run: python scrape_filings.py

      - name: Upload rendered HTML (parser debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-html
          path: scripts/artifacts/
          if-no-files-found: ignore
          retention-days: 7
