name: Scrape filings (TMX + SEDAR+)

# 9 AM and 4 PM in São Paulo / Buenos Aires (GMT-3) = 12:00 and 19:00 UTC.
on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 25
    env:
      BACKEND_URL: ${{ secrets.REFRESH_API_URL }}
      REFRESH_SECRET: ${{ secrets.REFRESH_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Sanity check
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$REFRESH_SECRET" ]; then
            echo "Missing REFRESH_API_URL or REFRESH_SECRET secret." >&2
            exit 1
          fi
          if ! command -v python3 >/dev/null 2>&1; then
            echo "python3 not found on this Mac. Install via 'brew install python@3.11' or from python.org" >&2
            exit 1
          fi
          python3 --version

      - name: Create venv and install deps
        working-directory: scripts
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium for Playwright
        working-directory: scripts
        run: |
          source .venv/bin/activate
          python -m playwright install chromium

      - name: Run scraper
        working-directory: scripts
        run: |
          source .venv/bin/activate
          python scrape_filings.py

      - name: Upload rendered HTML (parser debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-html
          path: scripts/artifacts/
          if-no-files-found: ignore
          retention-days: 7
