name: Scrape filings (TMX + SEDAR+)

# 9 AM and 4 PM in São Paulo / Buenos Aires (GMT-3) = 12:00 and 19:00 UTC.
# Self-hosted runner: if the Mac is asleep at cron time the job queues
# and runs when the runner reconnects.
on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  scrape:
    # Self-hosted runner installed on your macOS laptop.
    # To fall back to GitHub's cloud runners temporarily, change this to
    #   runs-on: ubuntu-latest
    # and reinstate `--with-deps` on the playwright install step below.
    runs-on: [self-hosted, macOS]
    timeout-minutes: 25
    env:
      BACKEND_URL: ${{ secrets.REFRESH_API_URL }}
      REFRESH_SECRET: ${{ secrets.REFRESH_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Sanity check secrets
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$REFRESH_SECRET" ]; then
            echo "Missing REFRESH_API_URL or REFRESH_SECRET secret." >&2
            exit 1
          fi

      - name: Point setup-python at a writable cache dir
        # Default is /Users/runner/hostedtoolcache (GitHub's cloud user) which
        # doesn't exist on a self-hosted Mac running as your own account.
        run: |
          mkdir -p "$HOME/hostedtoolcache"
          echo "AGENT_TOOLSDIRECTORY=$HOME/hostedtoolcache" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python deps
        run: pip install -r scripts/requirements.txt

      - name: Install Chromium for Playwright
        # macOS doesn't need --with-deps (that's Linux apt only).
        run: python -m playwright install chromium

      - name: Run scraper
        working-directory: scripts
        run: python scrape_filings.py

      - name: Upload rendered HTML (parser debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-html
          path: scripts/artifacts/
          if-no-files-found: ignore
          retention-days: 7
