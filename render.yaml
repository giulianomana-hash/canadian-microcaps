# Render.com blueprint - defines both services in one click.
# Docs: https://render.com/docs/blueprint-spec

services:
  # ---------- FastAPI backend ----------
  - type: web
    name: sedarwatchlist-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: REFRESH_SECRET
        sync: false           # shared with the GitHub Actions cron
      - key: RESEND_API_KEY
        sync: false           # optional; leave blank to disable email
      - key: RESEND_FROM
        value: "SedarWatchlist <onboarding@resend.dev>"
      - key: NOTIFY_EMAIL
        sync: false           # email address to send filings notifications to

  # ---------- Vite/React frontend (static, always-on free tier) ----------
  - type: web
    name: sedarwatchlist-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
